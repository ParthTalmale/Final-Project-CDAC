services:
  # 1. Database Service
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    environment:
      # Root password for admin access
      MYSQL_ROOT_PASSWORD: root
      # These variables AUTO-CREATE the database and user on first startup!
      MYSQL_DATABASE: mediConnectDb
      MYSQL_USER: medi_user
      MYSQL_PASSWORD: medi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend Service
  backend:
    build: ./spring_boot_backend_template (Our Work)
    container_name: backend-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Connected to the internal 'mysql' service name
      DB_URL: jdbc:mysql://mysql:3306/mediConnectDb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: medi_user
      DB_PASSWORD: medi_password
      RAZORPAY_KEY: rzp_test_SA3qJqIkr0IH3u
      RAZORPAY_SECRET: rhMAmdHBMZUxX1BUahx0myrG

  # 3. Frontend Service
  frontend:
    build: ./mediconnect-frontend (Our Work)
    container_name: frontend-app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      # Browser needs to reach backend. 
      # On Linux --net host is best, but for Compose bridge network, 
      # we usually point client to localhost if mapped, or reverse proxy.
      # For simplicity in dev, we point to localhost as the user accesses via browser.
      VITE_API_URL: http://localhost:8080/api

volumes:
  mysql_data:
