version: '3.8'

services:
  # 1. Database Service
  mysql_db:
    image: mysql:8.0
    container_name: mediconnect_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediconnect_db
    ports:
      - "3307:3306" # Maps host 3307 to container 3306 (avoids conflict if you have local MySQL)
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Backend Service
  backend:
    build: ./spring_boot_backend_template (Our Work)
    container_name: mediconnect_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/mediconnect_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql_db

  # 3. Frontend Service
  frontend:
    build: ./mediconnect-frontend (Our Work)
    container_name: mediconnect_frontend
    ports:
      - "80:80" # Exposed on Port 80
    depends_on:
      - backend

volumes:
  mysql_data:
